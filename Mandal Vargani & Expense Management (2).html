        function loadState() {
            const saved = localStorage.getItem('mandal_app_state_v2');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) { console.error("Error loading save", e); }
            }
        }

        function saveState() {
            localStorage.setItem('mandal_app_state_v2', JSON.stringify({
                users: state.users,
                varganis: state.varganis,
                expenses: state.expenses,
                collectors: state.collectors,
                gallery: state.gallery,
                auditLogs: state.auditLogs
            }));
        }

        function logAudit(action) {
            const userName = state.currentUser ? state.currentUser.name : 'System';
            const now = new Date().toLocaleString();
            state.auditLogs.unshift({
                id: 'A_' + Date.now(),
                timestamp: now,
                user: userName,
                action: action
            });
            saveState();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `px-4 py-3 rounded-xl shadow-lg text-white font-medium flex items-center space-x-3 transition transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-lg"></i><span>${message}</span>`;
            container.appendChild(el);
            setTimeout(() => { el.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                el.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => el.remove(), 300);
            }, 3500);
        }

        function render() {

                app.innerHTML = renderLogin();
                attachLoginEvents();
                return;

                            </button>

                                ${state.lang === 'en' ? 'मराठी' : 'English'}
                            </button>

                            <!-- Audio Mantra Button -->

                            ${renderNavItem('vargani', translations[state.lang].vargani, 'fa-receipt')}
                            ${renderNavItem('unpaid', translations[state.lang].unpaid, 'fa-clock-rotate-left')}
                            ${renderNavItem('expenses', translations[state.lang].expenses, 'fa-wallet')}
                            ${renderNavItem('collectors', translations[state.lang].collectors, 'fa-users-line')}

                    <i class="fa-solid ${icon} text-lg w-6 text-center"></i>
                    <span>${label}</span>
                </button>
            `;
        }

                            <p class="font-semibold text-slate-700 mb-1">Demo Credentials:</p>
                            <p>Admin: <span class="font-mono text-saffron-700 font-bold">9876543210</span> / <span class="font-mono">admin123</span></p>
                            <p>Karyakarta: <span class="font-mono text-saffron-700 font-bold">9123456789</span> / <span class="font-mono">user123</span></p>
                        </div>
                    </div>
                </div>

        function attachLoginEvents() {
            const form = document.getElementById('login-form');
            if (form) {
                form.onsubmit = (e) => {
                    e.preventDefault();
                    const mob = document.getElementById('login-mobile').value.trim();
                    const pwd = document.getElementById('login-password').value.trim();
                    const found = state.users.find(u => u.mobile === mob && u.password === pwd && u.active);
                    if (found) {
                        state.currentUser = found;
                        logAudit(`User Logged In: ${found.name} (${found.role})`);
                        showToast(`Welcome back, ${found.name}!`);
                        render();
                    } else {
                        const err = document.getElementById('login-error');
                        err.innerText = translations[state.lang].invalidLogin;
                        err.classList.remove('hidden');
                    }
                };
            }
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('login-password');
            const icon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pwdInput.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        function toggleLanguage() {
            state.lang = state.lang === 'en' ? 'mr' : 'en';
            render();
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function switchTab(tab) {
            state.currentTab = tab;
            render();
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        // --- Vargani Modal ---
        function openVarganiModal(id = null) {
            const item = id ? state.varganis.find(v => v.id === id) : null;
            const collectorsOptions = state.collectors.map(c => `<option value="${c.name}" ${item && item.collector === c.name ? 'selected' : ''}>${c.name}</option>`).join('');

            openModal(`
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Type</label>
                            <select id="m-type" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                                <option value="general" ${item && item.type === 'general' ? 'selected' : ''}>General Vargani</option>
                                <option value="sabhasad" ${item && item.type === 'sabhasad' ? 'selected' : ''}>Sabhasad Vargani</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Collector Name</label>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Donor / Sabhasad Name</label>

                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Mobile (WhatsApp)</label>
                            <input type="text" id="m-mobile" required value="${item ? item.mobile : ''}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Address / Galli</label>
                            <input type="text" id="m-address" required value="${item ? item.address : ''}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Total Amount (₹)</label>
                            <input type="number" id="m-amount" required value="${item ? item.amount : 1000}" oninput="calcRemaining()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Advance (₹)</label>
                            <input type="number" id="m-advance" required value="${item ? item.advance : 1000}" oninput="calcRemaining()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-emerald-600">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Remaining (₹)</label>
                            <input type="number" id="m-remaining" readonly value="${item ? item.remaining : 0}" class="w-full p-2.5 bg-slate-100 border border-slate-300 rounded-xl font-bold text-rose-600">
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="quickAmount(500)" class="bg-saffron-50 text-saffron-700 px-3 py-1 rounded-lg font-bold">₹500</button>

                        <button type="button" onclick="quickAmount(2100)" class="bg-saffron-50 text-saffron-700 px-3 py-1 rounded-lg font-bold">₹2100</button>
                        <button type="button" onclick="quickAmount(5000)" class="bg-saffron-50 text-saffron-700 px-3 py-1 rounded-lg font-bold">₹5000</button>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Payment Mode</label>
                            <select id="m-mode" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                                <option value="Cash" ${item && item.paymentMode === 'Cash' ? 'selected' : ''}>Cash</option>
                                <option value="Google Pay" ${item && item.paymentMode === 'Google Pay' ? 'selected' : ''}>Google Pay</option>
                                <option value="PhonePe" ${item && item.paymentMode === 'PhonePe' ? 'selected' : ''}>PhonePe</option>
                                <option value="Paytm" ${item && item.paymentMode === 'Paytm' ? 'selected' : ''}>Paytm</option>
                                <option value="QR" ${item && item.paymentMode === 'QR' ? 'selected' : ''}>QR Code</option>
                                <option value="Cheque" ${item && item.paymentMode === 'Cheque' ? 'selected' : ''}>Cheque</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Date</label>
                            <input type="date" id="m-date" required value="${item ? item.date : new Date().toISOString().split('T')[0]}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                        </div>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-semibold">Cancel</button>
                        <button type="submit" class="px-5 py-2 bg-saffron-600 text-white rounded-xl font-semibold shadow">Save Record</button>
                    </div>
                </form>
            `);

            document.getElementById('vargani-form').onsubmit = (e) => {
                e.preventDefault();
                const total = parseFloat(document.getElementById('m-amount').value) || 0;
                const adv = parseFloat(document.getElementById('m-advance').value) || 0;
                const rem = total - adv;
                const status = rem <= 0 ? 'Paid' : (adv > 0 ? 'Partial' : 'Unpaid');

                const data = {
                    id: item ? item.id : 'V_' + Date.now().toString().slice(-4),
                    type: document.getElementById('m-type').value,
                    name: document.getElementById('m-name').value,
                    mobile: document.getElementById('m-mobile').value,
                    address: document.getElementById('m-address').value,
                    amount: total,
                    advance: adv,
                    remaining: rem,
                    paymentMode: document.getElementById('m-mode').value,
                    status: status,
                    collector: document.getElementById('m-collector').value,
                    date: document.getElementById('m-date').value
                };

                if (item) {
                    const idx = state.varganis.findIndex(x => x.id === item.id);
                    state.varganis[idx] = data;
                    logAudit(`Updated Vargani Receipt #${data.id} for ${data.name}`);
                    showToast("Record updated successfully!");
                } else {
                    state.varganis.unshift(data);
                    logAudit(`Created Vargani Receipt #${data.id} for ${data.name} (₹${data.amount})`);
                    showToast("Record added successfully!");
                }
                saveState();
                closeModal();
                render();
            };
        }

        function quickAmount(amt) {
            document.getElementById('m-amount').value = amt;
            document.getElementById('m-advance').value = amt;
            calcRemaining();
        }

        function calcRemaining() {
            const total = parseFloat(document.getElementById('m-amount').value) || 0;
            const adv = parseFloat(document.getElementById('m-advance').value) || 0;
            document.getElementById('m-remaining').value = Math.max(0, total - adv);
        }

            if (confirm("Are you sure you want to delete this record?")) {
                state.varganis = state.varganis.filter(v => v.id !== id);
                logAudit(`Deleted Vargani Receipt #${id}`);
                showToast("Record deleted successfully!", "error");
                saveState();
                render();

        }

                                <option value="Cash" ${item && item.paymentMode === 'Cash' ? 'selected' : ''}>Cash</option>
                                <option value="Google Pay" ${item && item.paymentMode === 'Google Pay' ? 'selected' : ''}>Google Pay</option>
                                <option value="PhonePe" ${item && item.paymentMode === 'PhonePe' ? 'selected' : ''}>PhonePe</option>
                                <option value="Net Banking" ${item && item.paymentMode === 'Net Banking' ? 'selected' : ''}>Net Banking</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Date</label>
                            <input type="date" id="e-date" required value="${item ? item.date : new Date().toISOString().split('T')[0]}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Reason / Notes</label>
                        <textarea id="e-reason" rows="2" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">${item ? item.reason : ''}</textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-semibold">Cancel</button>
                        <button type="submit" class="px-5 py-2 bg-saffron-600 text-white rounded-xl font-semibold shadow">Save Expense</button>
                    </div>
                </form>
            `);

            document.getElementById('expense-form').onsubmit = (e) => {
                e.preventDefault();
                const total = parseFloat(document.getElementById('e-amount').value) || 0;
                const adv = parseFloat(document.getElementById('e-advance').value) || 0;
                const rem = Math.max(0, total - adv);

                const data = {
                    id: item ? item.id : 'E_' + Date.now().toString().slice(-4),
                    title: document.getElementById('e-title').value,
                    category: document.getElementById('e-category').value,
                    paidTo: document.getElementById('e-paidto').value,
                    amount: total,
                    advance: adv,
                    remaining: rem,
                    paymentMode: document.getElementById('e-mode').value,
                    date: document.getElementById('e-date').value,
                    reason: document.getElementById('e-reason').value
                };

                if (item) {
                    const idx = state.expenses.findIndex(x => x.id === item.id);
                    state.expenses[idx] = data;
                    logAudit(`Updated Expense #${data.id}: ${data.title}`);
                    showToast("Expense updated successfully!");
                } else {
                    state.expenses.unshift(data);
                    logAudit(`Logged Expense #${data.id}: ${data.title} (₹${data.amount})`);
                    showToast("Expense added successfully!");
                }
                saveState();
                closeModal();
                render();
            };
        }

        function calcExpRemaining() {
            const total = parseFloat(document.getElementById('e-amount').value) || 0;
            const adv = parseFloat(document.getElementById('e-advance').value) || 0;
            document.getElementById('e-remaining').value = Math.max(0, total - adv);
        }

        function deleteExpense(id) {
            if (confirm("Delete this expense record?")) {
                state.expenses = state.expenses.filter(e => e.id !== id);
                logAudit(`Deleted Expense #${id}`);
                showToast("Expense deleted successfully!", "error");
                saveState();
                render();
            }
        }

        // --- Collector Modal ---
        function openCollectorModal(id = null) {
            const item = id ? state.collectors.find(c => c.id === id) : null;
            openModal(`
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                    <h3 class="font-yatra text-lg text-amber-900">${item ? 'Edit Collector' : 'Add Collector'}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form id="collector-form" class="space-y-4 text-xs">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Collector Name</label>
                        <input type="text" id="c-name" required value="${item ? item.name : ''}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Mobile Number</label>
                            <input type="text" id="c-mobile" required value="${item ? item.mobile : ''}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Assigned Area / Zone</label>
                            <input type="text" id="c-area" required value="${item ? item.area : ''}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Collection Target (₹)</label>
                        <input type="number" id="c-target" required value="${item ? item.target : 25000}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold">
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-semibold">Cancel</button>
                        <button type="submit" class="px-5 py-2 bg-saffron-600 text-white rounded-xl font-semibold shadow">Save Collector</button>
                    </div>
                </form>
            `);

            document.getElementById('collector-form').onsubmit = (e) => {
                e.preventDefault();
                const data = {
                    id: item ? item.id : 'C_' + Date.now().toString().slice(-4),
                    name: document.getElementById('c-name').value,
                    mobile: document.getElementById('c-mobile').value,
                    area: document.getElementById('c-area').value,
                    target: parseFloat(document.getElementById('c-target').value) || 0
                };
                if (item) {
                    const idx = state.collectors.findIndex(x => x.id === item.id);
                    state.collectors[idx] = data;
                    showToast("Collector updated successfully!");
                } else {
                    state.collectors.push(data);
                    showToast("Collector added successfully!");
                }
                saveState();
                closeModal();
                render();
            };
        }

        function deleteCollector(id) {
            if (confirm("Delete collector?")) {
                state.collectors = state.collectors.filter(c => c.id !== id);
                showToast("Collector deleted!", "error");
                saveState();
                render();
            }
        }

        // --- User / Karyakarta Modal ---
        function openUserModal(id = null) {
            const item = id ? state.users.find(u => u.id === id) : null;
            openModal(`
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                    <h3 class="font-yatra text-lg text-amber-900">${item ? 'Edit User / Member' : 'Add New Member'}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form id="user-form" class="space-y-4 text-xs">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Full Name</label>
                        <input type="text" id="u-name" required value="${item ? item.name : ''}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Mobile Number (Login ID)</label>
                            <input type="text" id="u-mobile" required value="${item ? item.mobile : ''}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Password</label>
                            <input type="text" id="u-password" required value="${item ? item.password : 'user123'}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Role / Authority</label>
                            <select id="u-role" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                                <option value="admin" ${item && item.role === 'admin' ? 'selected' : ''}>Admin (Full Access)</option>
                                <option value="karyakarta" ${item && item.role === 'karyakarta' ? 'selected' : ''}>Karyakarta (View Only)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Status</label>
                            <select id="u-active" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                                <option value="true" ${!item || item.active ? 'selected' : ''}>Active</option>
                                <option value="false" ${item && !item.active ? 'selected' : ''}>Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-semibold">Cancel</button>
                        <button type="submit" class="px-5 py-2 bg-saffron-600 text-white rounded-xl font-semibold shadow">Save Member</button>
                    </div>
                </form>
            `);

            document.getElementById('user-form').onsubmit = (e) => {
                e.preventDefault();
                const data = {
                    id: item ? item.id : 'U_' + Date.now().toString().slice(-4),
                    name: document.getElementById('u-name').value,
                    mobile: document.getElementById('u-mobile').value,
                    password: document.getElementById('u-password').value,
                    role: document.getElementById('u-role').value,
                    active: document.getElementById('u-active').value === 'true'
                };
                if (item) {
                    const idx = state.users.findIndex(x => x.id === item.id);
                    state.users[idx] = data;
                    showToast("Member updated successfully!");
                } else {
                    state.users.push(data);
                    showToast("New member added successfully!");
                }
                saveState();
                closeModal();
                render();
            };
        }

        function deleteUser(id) {
            if (confirm("Delete this user?")) {
                state.users = state.users.filter(u => u.id !== id);
                showToast("User deleted!", "error");
                saveState();
                render();
            }
        }

        // --- Gallery Upload Modal ---
        function openGalleryModal() {
            openModal(`
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                    <h3 class="font-yatra text-lg text-amber-900">Upload Ganpati Photo</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form id="gallery-form" class="space-y-4 text-xs">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Title / Description</label>
                        <input type="text" id="g-title" required placeholder="e.g. Ganpati Bappa 2025 Grand Visarjan" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Date</label>
                        <input type="date" id="g-date" required value="${new Date().toISOString().split('T')[0]}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Choose Photo File / URL</label>
                        <input type="file" id="g-file" accept="image/*" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl mb-2" onchange="previewFile(event)">
                        <input type="text" id="g-url" placeholder="Or paste Image URL" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-semibold">Cancel</button>
                        <button type="submit" class="px-5 py-2 bg-saffron-600 text-white rounded-xl font-semibold shadow">Upload Photo</button>
                    </div>
                </form>
            `);

            document.getElementById('gallery-form').onsubmit = (e) => {
                e.preventDefault();
                const url = document.getElementById('g-url').value || 'https://images.unsplash.com/photo-1567157577867-05ccb1388e66?auto=format&fit=crop&w=600&q=80';
                const data = {
                    id: 'G_' + Date.now().toString().slice(-4),
                    title: document.getElementById('g-title').value,
                    date: document.getElementById('g-date').value,
                    url: url
                };
                state.gallery.unshift(data);
                logAudit(`Uploaded Ganpati Photo: ${data.title}`);
                showToast("Photo uploaded successfully!");
                saveState();
                closeModal();
                render();
            };
        }

        function previewFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('g-url').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function deleteGalleryItem(id) {
            if (confirm("Delete this photo?")) {
                state.gallery = state.gallery.filter(g => g.id !== id);
                showToast("Photo deleted!", "error");
                saveState();
                render();
            }
        }

        // --- CSV Download Helpers ---
        function downloadVarganiCSV() {
            let csv = 'Receipt No,Type,Name,Mobile,Address,Total Amount,Advance,Remaining,Payment Mode,Status,Collector,Date\n';
            state.varganis.forEach(v => {
                csv += `"${v.id}","${v.type}","${v.name}","${v.mobile}","${v.address}",${v.amount},${v.advance},${v.remaining},"${v.paymentMode}","${v.status}","${v.collector}","${v.date}"\n`;
            });
            triggerDownload(csv, 'vargani_collections.csv');
        }

        function downloadExpenseCSV() {
            let csv = 'ID,Title,Category,Paid To,Total Amount,Advance,Remaining,Payment Mode,Date,Reason\n';
            state.expenses.forEach(e => {
                csv += `"${e.id}","${e.title}","${e.category}","${e.paidTo}",${e.amount},${e.advance},${e.remaining},"${e.paymentMode}","${e.date}","${e.reason}"\n`;
            });
            triggerDownload(csv, 'mandal_expenses.csv');
        }

        function triggerDownload(csvContent, filename) {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', filename);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast(`Downloaded ${filename} successfully!`);
        }

        // Initialize App on Load
        window.onload = function() {
            loadState();
            render();
        };
    </script>
